[project]
name = "laya-mcp"
version = "0.1.0"
description = "MCP server exposing laya typed decisions (rerank, route_model, decide) backed by laya-serve."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9,<2",      # 1.x line: stable FastMCP API (same as book-to-rag)
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.scripts]
laya-mcp = "laya_mcp.server:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: real-laya-serve end-to-end tests (auto-skipped when the service is not running)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
